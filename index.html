    .eruption-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }

    .eruption-card.selected { ring: 2px; }
    .vei-bar { height: 8px; border-radius: 4px; }
    .quiz-btn { transition: all 0.2s; }
    .quiz-btn:hover { transform: scale(1.02); }
    .quiz-btn.selected-opt { opacity: 0.6; }
    input:focus, select:focus { outline: none; }
    .eruption-visual { font-size: 48px; line-height: 1; }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-red-100 min-h-screen font-sans">

  <header class="text-center mb-6">

  </header>

  <div class="flex gap-2 mb-5 flex-wrap">
    <button class="tab-btn px-4 py-2 rounded-full font-semibold text-sm bg-red-500 text-white" data-tab="catalog" aria-label="カタログ表示" role="tab">📋 噴火タイプ一覧</button>
    <button class="tab-btn px-4 py-2 rounded-full font-semibold text-sm bg-gray-100 text-gray-600" data-tab="identifier" aria-label="識別ツール" role="tab">🔍 タイプ識別</button>

    <button class="tab-btn px-4 py-2 rounded-full font-semibold text-sm bg-gray-100 text-gray-600" data-tab="facts" aria-label="豆知識" role="tab">💡 豆知識</button>
  </div>

  <!-- Tab: Catalog -->
  <div id="tab-catalog" class="tab-content">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="eruption-cards"></div>
  </div>

  <!-- Tab: Identifier -->

// Render identifier quiz
function renderIdentifier() {
  const container = document.getElementById('quiz-questions');
  container.innerHTML = QUIZ_QUESTIONS.map(q => `
    <div>
      <p class="font-semibold text-gray-700 mb-2 text-sm">${q.text /* xss-ok: QUIZ_QUESTIONSハードコード配列のtext */}</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        ${q.options.map((opt, i) => `
          <button class="quiz-btn text-left bg-gray-50 hover:bg-orange-50 border-2 border-gray-200 hover:border-orange-400 rounded-xl px-3 py-2 text-sm transition-all"
            data-qid="${q.id /* xss-ok: QUIZ_QUESTIONSハードコード配列のid */}" data-val="${opt.value /* xss-ok: QUIZ_QUESTIONSハードコード配列のoption.value */}" aria-label="${opt.label /* xss-ok: QUIZ_QUESTIONSハードコード配列のoption.label */}を選択">
            ${opt.label /* xss-ok: QUIZ_QUESTIONSハードコード配列のoption.label */}
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.quiz-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const qid = btn.dataset.qid;
      const val = btn.dataset.val;
      // Convert string to appropriate type
      let v = val;
      if (val === 'true') v = true;
      else if (val === 'false') v = false;
      else v = parseInt(val);
      quizAnswers[qid] = v;

      // Visual update: deselect others in group
      container.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => {
        b.classList.remove('bg-orange-100', 'border-orange-500', 'font-semibold');
        b.classList.add('bg-gray-50', 'border-gray-200');
      });
      btn.classList.add('bg-orange-100', 'border-orange-500', 'font-semibold');
      btn.classList.remove('bg-gray-50', 'border-gray-200');
    });
  });
}

// Identify eruption type
function identifyEruption() {
  const answered = Object.keys(quizAnswers);
  if (answered.length < 4) {
    alert('すべての質問に回答してください。');
    return;
  }

  const { q1, q2, q3, q4 } = quizAnswers;

  let matches = ERUPTION_TYPES.map(t => {
    let score = 0;
    if (q1 === t.explosivityScore) score += 3;
    else if (Math.abs(q1 - t.explosivityScore) === 1) score += 1;
    if (q2 === t.lavaFlow) score += 3;
    if (q3 === t.pyroclastic) score += 3;
    if (q4 === t.columnScore) score += 2;
    else if (Math.abs(q4 - t.columnScore) === 1) score += 1;
    return { type: t, score };
  }).sort((a, b) => b.score - a.score);

  const best = matches[0];
  const second = matches[1];
  const t = best.type;

  document.getElementById('result-content').innerHTML = `
    <div class="flex items-center gap-3 mb-3">
      <span class="text-4xl">${t.emoji /* xss-ok: ERUPTION_TYPESハードコード配列のemoji */}</span>
      <div>
        <div class="text-xl font-bold text-gray-800">${t.name /* xss-ok: ERUPTION_TYPESハードコード配列のname */}（${t.nameEn /* xss-ok: ERUPTION_TYPESハードコード配列のnameEn */}）</div>
        <div class="text-sm text-gray-500">VEI ${t.vei /* xss-ok: ERUPTION_TYPESハードコード配列のvei */} / ${t.columnHeight /* xss-ok: ERUPTION_TYPESハードコード配列のcolumnHeight */}の噴煙</div>
      </div>
    </div>
    <p class="text-sm text-gray-700 mb-3">${t.desc /* xss-ok: ERUPTION_TYPESハードコード配列のdesc */}</p>
    <div class="bg-orange-100 rounded-lg p-3 text-sm text-orange-800 mb-2">
      <strong>主な特徴:</strong> ${t.features.join('・') /* xss-ok: ERUPTION_TYPESハードコード配列のfeaturesを結合 */}
    </div>
    ${second && second.score > 3 ? `<p class="text-xs text-gray-500">次に近い可能性: <strong>${second.type.name /* xss-ok: ERUPTION_TYPESハードコード配列のname */}</strong></p>` : ''}
  `;
  document.getElementById('identify-result').classList.remove('hidden');
}

// Render volcano table
function renderVolcanoes() {
  const tbody = document.getElementById('volcano-table');
  tbody.innerHTML = VOLCANOES.map((v, i) => `
    <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-red-50'} hover:bg-orange-50">
      <td class="py-2 px-3 font-semibold text-gray-800">${v.name /* xss-ok: VOLCANOESハードコード配列のname */}</td>
      <td class="py-2 px-2 text-gray-600 text-xs">${v.location /* xss-ok: VOLCANOESハードコード配列のlocation */}</td>
      <td class="py-2 px-2"><span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">${v.type /* xss-ok: VOLCANOESハードコード配列のtype */}</span></td>
      <td class="py-2 px-3 text-xs text-gray-500">${v.note /* xss-ok: VOLCANOESハードコード配列のnote */}</td>
    </tr>
  `).join('');
}

// Render facts
function renderFacts() {
  const container = document.getElementById('facts-content');
  container.innerHTML = FACTS.map((f, i) => `
    <div class="bg-white rounded-2xl shadow p-5">
      <h3 class="font-bold text-gray-800 mb-2 flex items-center gap-2"><span class="text-orange-500">💡</span>${f.title /* xss-ok: FACTSハードコード配列のtitle */}</h3>
      <p class="text-sm text-gray-600 leading-relaxed">${f.content /* xss-ok: FACTSハードコード配列のcontent */}</p>
    </div>
  `).join('');
}

// Tab switching
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('bg-red-500', 'text-white');
    btn.classList.add('bg-gray-100', 'text-gray-600');
  });
  document.getElementById('tab-' + name).classList.remove('hidden');
  document.querySelector(`[data-tab="${name}"]`).classList.add('bg-red-500', 'text-white');
  document.querySelector(`[data-tab="${name}"]`).classList.remove('bg-gray-100', 'text-gray-600');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('btn-identify').addEventListener('click', identifyEruption);

// Init
renderCatalog();
renderIdentifier();
renderVolcanoes();
renderFacts();
</script>
</body>
</html>
